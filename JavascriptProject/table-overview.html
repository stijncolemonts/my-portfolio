<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Table Overview</title>
        <link type="text/css" href="styles/style.css" rel="stylesheet" />
        <script src="js/dom.js" defer></script>
        <script src="js/table-overview.js" defer></script>
    </head>
    <body>
        <header>
            <img src="images/RandomGeneratedAfbeeldingVoorGames.png" alt="Logo image of games" class="logo" />
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="statistics.html">Statistics</a></li>
                    <li class="actual"><a href="table-overview.html">Table Overview</a></li>
                    <li><a href="add-game.html">Add Game</a></li>
                    <li><a href="minecraft.html">Minecraft</a></li>
                    <li><a href="freetogame.html" target="_blank">Free To Game</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <h2>My Games</h2>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Rating</th>
                        <th>delete</th>
                    </tr>
                </thead>
                <tbody id="table-tbody"></tbody>
            </table>
            <button id="show-favourites">Show my Favourites</button>
            <button id="show-all">Show All</button>
            <label>show games with a higher rating than:</label>
            <input type="number" id="rating-input"/>
            <input type="text" id="search-input" placeholder="Search by name">
            <button id="search-btn">Fetch Games</button>

            <div id="status">
                <h3>Status</h3>
            </div>
        </main>
    </body>
</html>
